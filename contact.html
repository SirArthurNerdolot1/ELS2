<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - English Literary Society IIT Kanpur</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background-color: #F0D8B6; /* fallback light warm color */
      background-image: url('paper-texture-wide.png');
      background-repeat: repeat-x;   /* repeat horizontally like wide paper */
      background-position: top center;
      background-attachment: fixed;  /* keep background fixed when scrolling */
      background-size: auto;         /* use actual image size, or adjust below */
      color: #111;
      scroll-behavior: smooth;
    }
    nav a:hover, h3:hover {
      text-decoration-thickness: 2px;
      transition: text-decoration-thickness 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      transition: transform 0.3s ease;
    }
    input, textarea {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="mb-16 flex flex-col md:flex-row md:items-center md:justify-between max-w-screen-xl mx-auto px-6 py-12" data-aos="fade-down">
    <h1 class="text-4xl font-bold tracking-wide">English Literary Society</h1>
    <nav class="mt-6 md:mt-0 space-x-8 text-lg font-light uppercase tracking-widest">
      <a href="index.html" class="hover:text-gray-700">Home</a>
      <a href="about.html" class="hover:text-gray-700">About</a>
      <a href="events.html" class="hover:text-gray-700">Events</a>
      <a href="blog.html" class="hover:text-gray-700">Blog</a>
       <a href="Dandelion.html" class="hover:text-gray-700">Dandelion</a>
      <a href="contact.html" class="hover:text-gray-700">Contact</a>
    </nav>
  </header>

  <!-- Contact Form -->
  <main class="max-w-4xl mx-auto px-6 mb-24" data-aos="fade-up">
    <h2 class="text-4xl font-semibold mb-8 border-b-2 border-gray-300 pb-2">Contact Us</h2>
    <form action="#" method="POST" class="space-y-8">
      <div>
        <label for="name" class="block text-lg font-semibold mb-2">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          class="w-full border border-gray-400 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-700"
        />
      </div>
      <div>
        <label for="email" class="block text-lg font-semibold mb-2">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="w-full border border-gray-400 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-700"
        />
      </div>
      <div>
        <label for="message" class="block text-lg font-semibold mb-2">Message</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          required
          class="w-full border border-gray-400 rounded-md px-4 py-3 resize-none focus:outline-none focus:ring-2 focus:ring-gray-700"
        ></textarea>
      </div>
      <button
        type="submit"
        class="bg-gray-800 text-white px-8 py-4 rounded-md uppercase font-semibold tracking-widest"
      >
        Send Message
      </button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="mt-32 text-center text-gray-500 text-sm max-w-screen-xl mx-auto px-6 py-12" data-aos="fade-up" data-aos-delay="500">
    &copy; 2025 English Literary Society IIT Kanpur. All rights reserved.
  </footer>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 800,
      easing: 'ease-in-out',
      once: true,
    });
  </script>
</body>
</html>
