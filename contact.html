<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - English Literary Society IIT Kanpur</title>
  <link rel="icon" href="images/logo-bg.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background-color: #fef9f4;
      background-image: url('paper-texture-wide.png');
      background-repeat: repeat-x;
      background-position: top center;
      background-attachment: fixed;
      background-size: auto;
      color: #111;
      scroll-behavior: smooth;
    }
    nav a:hover,
    h3:hover {
      text-decoration-thickness: 2px;
      transition: text-decoration-thickness 0.3s ease;
    }
    button:hover {
      transform: scale(1.05);
      transition: transform 0.3s ease;
    }
    input, textarea {
      font-family: 'Playfair Display', serif;
    }
    section.spacious-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 3rem;
      max-width: 1100px;
      margin: auto;
      position: relative;
    }
    .content-box {
      background-color: rgba(255 255 255 / 0.95);
      padding: 4rem 4rem 4rem 5rem;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgb(0 0 0 / 0.12);
      max-width: 750px;
      z-index: 2;
      font-size: 1.35rem;
      line-height: 1.9;
      color: #2a2a2a;
    }
    section.spacious-section h2 {
      font-size: 3.5rem;
      margin-bottom: 2rem;
      border-bottom: 4px solid #ccc;
      padding-bottom: 0.75rem;
    }
    @media (max-width: 1024px) {
      section.spacious-section {
        flex-direction: column;
        padding: 4rem 2rem;
        min-height: auto;
      }
      .content-box {
        max-width: 100%;
        padding-left: 3rem;
        padding-right: 3rem;
        margin-bottom: 3rem;
        font-size: 1.15rem;
      }
    }
    @media (max-width: 480px) {
      section.spacious-section h2 {
        font-size: 2.5rem;
      }
      .content-box {
        padding-left: 2rem;
        padding-right: 2rem;
      }
    }
  </style>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-[#fef9f4]/90 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-screen-xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html">
          <img src="images/logo.png" alt="ELS Logo" class="h-12 w-auto sm:h-16"  loading="lazy" />
        </a>
        <h2 id="navbar-title" class="text-xl sm:text-2xl font-bold tracking-wide hidden md:block">
          English Literary Society IIT Kanpur
        </h2>
      </div>
      <nav class="hidden md:flex space-x-6 text-sm md:text-base font-light uppercase tracking-widest">
        <a href="index.html" class="hover:text-gray-700">Home</a>
        <a href="about.html" class="hover:text-gray-700">About</a>
        <a href="events.html" class="hover:text-gray-700">Events</a>
        <a href="blog.html" class="hover:text-gray-700">Blog</a>
        <a href="Dandelion.html" class="hover:text-gray-700">Dandelion</a>
        <a href="contact.html" class="hover:text-gray-700 nav-current">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Contact Section -->
  <section class="spacious-section" data-aos="fade-up">
    <div class="content-box">
      <h2>Contact Us</h2>
      <form action="#" method="POST" class="space-y-8 mt-8">
        <div>
          <label for="name" class="block text-lg font-semibold mb-2">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            class="w-full border border-gray-400 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-700"
          />
        </div>
        <div>
          <label for="email" class="block text-lg font-semibold mb-2">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="w-full border border-gray-400 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-700"
          />
        </div>
        <div>
          <label for="message" class="block text-lg font-semibold mb-2">Message</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            required
            class="w-full border border-gray-400 rounded-md px-4 py-3 resize-none focus:outline-none focus:ring-2 focus:ring-gray-700"
          ></textarea>
        </div>
        <button
          type="submit"
          class="bg-gray-800 text-white px-8 py-4 rounded-md uppercase font-semibold tracking-widest hover:scale-105 transition-transform"
        >
          Send Message
        </button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="mt-32 text-center text-gray-500 text-sm max-w-screen-xl mx-auto px-6 py-12" data-aos="fade-up" data-aos-delay="500">
    <p class="colophon-mark">❦</p>
    <nav class="site-socials" aria-label="Social links">
      <a href="https://www.instagram.com/elsiitk/?hl=en" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.15" cy="6.85" r="1.05" fill="currentColor"/></svg>
        <span>Instagram</span>
      </a>
      <a href="https://englishliterarysocietyiitk.substack.com/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.2 4.4h17.6v2.15H3.2V4.4zm0 4.05h17.6V20.2L12 16.45 3.2 20.2V8.45z"/></svg>
        <span>Substack</span>
      </a>
    </nav>
    <p class="colophon-line">Set in Playfair Display &amp; Georgia · IIT Kanpur</p>
    <p>&copy; 2026 English Literary Society IIT Kanpur. All rights reserved.</p>
  </footer>

  <!-- AOS Animation -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 800,
      easing: 'ease-in-out',
      once: true,
    });
  </script>
</body>
</html>
